name: Deploy Aex site to Vercel

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Exact 40-character Site commit selected by release/sha-<commit>"
        required: true
        type: string
      promote:
        description: Assign this exact build to aex.dev after its staging smoke test
        required: true
        default: false
        type: boolean
      managed_sandbox_nat_cidrs:
        description: 'Exact Platform JSON output, e.g. ["203.0.113.1/32","203.0.113.2/32","203.0.113.3/32"]'
        required: false
        default: ""
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-vercel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Require immutable manual source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SELECTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SELECTED_REF" = "refs/tags/release/sha-$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Pull production settings
        run: npx --yes vercel@59.1.4 pull --yes --environment=production
      - name: Build production artifact
        run: npx --yes vercel@59.1.4 build --prod
      - name: Deploy protected staging build
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes vercel@59.1.4 deploy --prebuilt --prod --skip-domain | tail -n 1)"
          [[ "$deployment_url" == https://*.vercel.app ]] || {
            echo "Vercel did not return a deployment URL" >&2
            exit 1
          }
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Staged $deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the staged website
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if npx --yes vercel@59.1.4 curl / --deployment "$DEPLOYMENT_URL" > homepage.html; then
              break
            fi
            sleep 5
          done
          sed -E 's/<[^>]+>//g' homepage.html > homepage.txt
          grep -Fq "The backend for AI workloads" homepage.txt
          grep -Fq "High-performance, reliable, and simple infrastructure" homepage.txt
          grep -Fq "Start a session with your models and tools" homepage.txt
          grep -Fq "@aexhq/sdk" homepage.txt
          grep -Fq "getWeather" homepage.txt
          grep -Fq "session.send" homepage.txt
          grep -Fq "output:" homepage.txt
          ! grep -Fq "session.output" homepage.txt
          grep -Fq "gpt-5.4" homepage.txt
          grep -Fq "OPENAI_API_KEY" homepage.txt
          ! grep -Fq "AI_GATEWAY_API_KEY" homepage.txt
          ! grep -Fq "ai-gateway.vercel.sh" homepage.txt
          ! grep -Fq "sk-ant-" homepage.txt
          grep -Fq "wordmark-mark" homepage.html
          grep -Fq "brain and hands pattern" homepage.txt
          grep -Fq "Subagents" homepage.txt
          grep -Fq "Active computer" homepage.txt
          grep -Fq "0.5 vCPU + 1 GB memory" homepage.txt
          grep -Fq "Storage" homepage.txt
          grep -Fq "first six months after launch" homepage.txt
          grep -Fq "confirm the discount before billing starts" homepage.txt
          grep -Fq "Join the alpha" homepage.txt
          npx --yes vercel@59.1.4 curl /aex-mark-black.webp --deployment "$DEPLOYMENT_URL" > aex-mark-black.webp
          npx --yes vercel@59.1.4 curl /aex-mark-white.webp --deployment "$DEPLOYMENT_URL" > aex-mark-white.webp
          test -s aex-mark-black.webp
          test -s aex-mark-white.webp
          ! grep -Eiq "Agent backend for AI apps|The session backend|Aex / Alpha|01 / SDK|From one tool to a finished result|Long-lived by design|The infrastructure between a prompt|Pay for the work|The brain remembers|simple, elegant|Suspended computer|A light engine leaves the model room to work|Claude Managed Agents|2,002|Founding beta|Join the beta|eu-west-1|Linux workspace|Suspended machine" homepage.txt
      - name: Reconcile managed-sandbox source denies
        if: github.event_name == 'workflow_dispatch' && (inputs.promote || inputs.managed_sandbox_nat_cidrs != '')
        env:
          AEX_MANAGED_SANDBOX_NAT_CIDRS: ${{ inputs.managed_sandbox_nat_cidrs }}
        run: node scripts/sync-managed-sandbox-firewall.mjs
      - name: Promote the staged build to aex.dev
        if: github.event_name == 'workflow_dispatch' && inputs.promote
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: npx --yes vercel@59.1.4 alias set "$DEPLOYMENT_URL" aex.dev
      - name: Verify aex.dev
        if: github.event_name == 'workflow_dispatch' && inputs.promote
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 https://aex.dev/ > homepage.html \
              && sed -E 's/<[^>]+>//g' homepage.html > homepage.txt \
              && grep -Fq "The backend for AI workloads" homepage.txt \
              && grep -Fq "High-performance, reliable, and simple infrastructure" homepage.txt \
              && grep -Fq "Start a session with your models and tools" homepage.txt \
              && grep -Fq "@aexhq/sdk" homepage.txt \
              && grep -Fq "getWeather" homepage.txt \
              && grep -Fq "session.send" homepage.txt \
              && grep -Fq "output:" homepage.txt \
              && ! grep -Fq "session.output" homepage.txt \
              && grep -Fq "gpt-5.4" homepage.txt \
              && grep -Fq "OPENAI_API_KEY" homepage.txt \
              && ! grep -Fq "AI_GATEWAY_API_KEY" homepage.txt \
              && ! grep -Fq "ai-gateway.vercel.sh" homepage.txt \
              && ! grep -Fq "sk-ant-" homepage.txt \
              && grep -Fq "wordmark-mark" homepage.html \
              && grep -Fq "brain and hands pattern" homepage.txt \
              && grep -Fq "Subagents" homepage.txt \
              && grep -Fq "Active computer" homepage.txt \
              && grep -Fq "0.5 vCPU + 1 GB memory" homepage.txt \
              && grep -Fq "Storage" homepage.txt \
              && grep -Fq "first six months after launch" homepage.txt \
              && grep -Fq "confirm the discount before billing starts" homepage.txt \
              && grep -Fq "Join the alpha" homepage.txt \
              && curl --fail --silent --show-error --max-time 20 https://aex.dev/aex-mark-black.webp > aex-mark-black.webp \
              && curl --fail --silent --show-error --max-time 20 https://aex.dev/aex-mark-white.webp > aex-mark-white.webp \
              && test -s aex-mark-black.webp \
              && test -s aex-mark-white.webp \
              && ! grep -Eiq "Agent backend for AI apps|The session backend|Aex / Alpha|01 / SDK|From one tool to a finished result|Long-lived by design|The infrastructure between a prompt|Pay for the work|The brain remembers|simple, elegant|Suspended computer|A light engine leaves the model room to work|Claude Managed Agents|2,002|Founding beta|Join the beta|eu-west-1|Linux workspace|Suspended machine" homepage.txt; then
              echo "Promoted and verified https://aex.dev" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "aex.dev did not serve the promoted build" >&2
          exit 1
