name: Deploy production site
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: site-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require tested immutable source
        env:
          EXPECTED: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$GITHUB_REF" = "refs/tags/release/sha-$EXPECTED"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          git merge-base --is-ancestor "$EXPECTED" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED&event=push" --jq '.workflow_runs | any(.conclusion == "success")' | grep -x true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npx --yes vercel@59.1.4 pull --yes --environment=production
      - run: npx --yes vercel@59.1.4 build --prod
      - name: Deploy production
        run: npx --yes vercel@59.1.4 deploy --prebuilt --prod
      - name: Verify public routes
        run: |
          set -euo pipefail
          for route in / /dashboard /docs /brain /brain/docs /status /privacy /terms; do
            curl --retry 6 --retry-all-errors --fail --silent --show-error "https://aex.dev$route" -o /dev/null
          done
          curl --fail --silent https://aex.dev/dashboard | grep -q 'Continue with Google'
          curl --fail --silent https://aex.dev/docs | grep -q '@aexhq/sdk@0.69.0'
          test "$(curl --silent -o /dev/null -w '%{http_code}' https://api.aex.dev/health/ready)" = 204
          echo 'Deployed and verified https://aex.dev' >> "$GITHUB_STEP_SUMMARY"
