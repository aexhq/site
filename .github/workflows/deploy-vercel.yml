name: Deploy Aex site to Vercel

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Exact 40-character Site commit selected by release/sha-<commit>"
        required: true
        type: string
      promote:
        description: Assign this exact build to aex.dev after its staging smoke test
        required: true
        default: false
        type: boolean
      managed_environment_blocked_source_ipv4_cidrs:
        description: 'Exact Platform JSON output, e.g. ["203.0.113.1/32","203.0.113.2/32","203.0.113.3/32"]'
        required: false
        default: ""
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-vercel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require immutable manual source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SELECTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SELECTED_REF" = "refs/tags/release/sha-$EXPECTED_COMMIT"
          test "$(git cat-file -t "$SELECTED_REF")" = tag
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Pull production settings
        run: npx --yes vercel@59.1.4 pull --yes --environment=production
      - name: Build production artifact
        run: npx --yes vercel@59.1.4 build --prod
      - name: Deploy protected staging build
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes vercel@59.1.4 deploy --prebuilt --prod --skip-domain | tail -n 1)"
          [[ "$deployment_url" == https://*.vercel.app ]] || {
            echo "Vercel did not return a deployment URL" >&2
            exit 1
          }
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Staged $deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the staged website
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          curl_page() {
            npx --yes vercel@59.1.4 curl "$1" --deployment "$DEPLOYMENT_URL"
          }
          for attempt in {1..12}; do
            if curl_page / > homepage.html; then break; fi
            sleep 5
          done
          sed -E 's/<[^>]+>//g' homepage.html > homepage.txt

          # The landing page is a shell: wordmark, headline, two links. Nothing else.
          grep -Fq "Agent infra for next era" homepage.txt
          grep -Fq "wordmark-mark" homepage.html
          grep -Fq "theme-toggle" homepage.html
          grep -Fq "https://github.com/aexhq" homepage.html
          grep -Fq 'href="/brain"' homepage.html
          grep -Fq "THINK SLOWLY LTD" homepage.txt

          # Nothing the hosted product has not shipped.
          ! grep -Eiq "The backend for AI workloads|High-performance, reliable|Join the alpha|Provider cost|Exact AI Gateway receipt|Agentloop extensions|Model bindings|Tool definitions|Environment extensions" homepage.txt
          ! grep -Fq "admitAgentloop" homepage.txt
          ! grep -Fq "sk-ant-" homepage.txt
          ! grep -Fq "ai-gateway.vercel.sh" homepage.txt

          curl_page /brain > brain.html
          sed -E 's/<[^>]+>//g' brain.html > brain.txt
          grep -Fq "A tiny, blazing fast, extensible agent runtime." brain.txt
          grep -Fq "Brain is under early development" brain.txt
          grep -Fq "Sessions rebuild from their own journal on restart" brain.txt
          grep -Fq "ghcr.io/aexhq/brain:latest" brain.txt
          grep -Fq "https://github.com/aexhq/brain" brain.html
          # Benchmark figures stay unpublished until the harness is rebuilt.
          ! grep -Eq "2,002 turns|1\.4 ms|21-31 KiB" brain.txt
          ! grep -Fq "Apache" brain.txt

          curl_page /brain/docs > docs.html
          sed -E 's/<[^>]+>//g' docs.html > docs.txt
          grep -Fq "Brain runs agent sessions" docs.txt

          # Generated from the session contract, never written by hand.
          curl_page /brain/docs/reference/api > api-index.html
          grep -Fq "Create Session" api-index.html
          curl_page /brain/docs/reference/api/createSession > api.html
          sed -E 's/<[^>]+>//g' api.html > api.txt
          grep -Fq "Create Session" api.txt
          grep -Fq "/v1/sessions" api.txt

          curl_page /static.json > search.json
          grep -Fq "/brain/docs/quickstart" search.json

          curl_page /aex-mark-black.webp > aex-mark-black.webp
          curl_page /aex-mark-white.webp > aex-mark-white.webp
          test -s aex-mark-black.webp
          test -s aex-mark-white.webp

          for route in /dashboard /status /privacy /terms; do
            curl_page "$route" >/dev/null
          done
      - name: Reconcile managed-environment source denies
        if: github.event_name == 'workflow_dispatch' && (inputs.promote || inputs.managed_environment_blocked_source_ipv4_cidrs != '')
        env:
          AEX_MANAGED_ENVIRONMENT_NAT_CIDRS: ${{ inputs.managed_environment_blocked_source_ipv4_cidrs }}
        run: node scripts/sync-managed-environment-firewall.mjs
      - name: Promote the staged build to aex.dev
        if: github.event_name == 'workflow_dispatch' && inputs.promote
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: npx --yes vercel@59.1.4 alias set "$DEPLOYMENT_URL" aex.dev
      - name: Verify aex.dev
        if: github.event_name == 'workflow_dispatch' && inputs.promote
        shell: bash
        run: |
          get() {
            curl --fail --silent --show-error --max-time 20 "https://aex.dev$1"
          }
          text() {
            sed -E 's/<[^>]+>//g'
          }
          check() {
            get / > homepage.html || return 1
            text < homepage.html > homepage.txt
            grep -Fq "Agent infra for next era" homepage.txt || return 1
            grep -Fq "wordmark-mark" homepage.html || return 1
            grep -Fq 'href="/brain"' homepage.html || return 1
            grep -Fq "THINK SLOWLY LTD" homepage.txt || return 1
            ! grep -Eiq "The backend for AI workloads|High-performance, reliable|Join the alpha|Provider cost|Exact AI Gateway receipt|Agentloop extensions" homepage.txt || return 1

            get /brain > brain.html || return 1
            text < brain.html > brain.txt
            grep -Fq "A tiny, blazing fast, extensible agent runtime." brain.txt || return 1
            grep -Fq "Brain is under early development" brain.txt || return 1
            grep -Fq "Sessions rebuild from their own journal on restart" brain.txt || return 1
            ! grep -Fq "Apache" brain.txt || return 1

            get /brain/docs > docs.html || return 1
            text < docs.html > docs.txt
            grep -Fq "Brain runs agent sessions" docs.txt || return 1

            # Generated from the session contract, never written by hand.
            get /brain/docs/reference/api/createSession > api.html || return 1
            text < api.html > api.txt
            grep -Fq "Create Session" api.txt || return 1
            grep -Fq "/v1/sessions" api.txt || return 1

            get /static.json > search.json || return 1
            grep -Fq "/brain/docs/quickstart" search.json || return 1

            get /aex-mark-black.webp > aex-mark-black.webp || return 1
            get /aex-mark-white.webp > aex-mark-white.webp || return 1
            test -s aex-mark-black.webp || return 1
            test -s aex-mark-white.webp || return 1

            for route in /dashboard /status /privacy /terms; do
              get "$route" > /dev/null || return 1
            done
          }
          for attempt in {1..12}; do
            if check; then
              echo "Promoted and verified https://aex.dev" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "aex.dev did not serve the promoted build" >&2
          exit 1
